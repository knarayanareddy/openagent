name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tzdata
          python -m pip install -e . --no-deps
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  adversarial-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest tzdata
          python -m pip install -e . --no-deps
      - name: Run security/adversarial tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_repo_solvable.py tests/test_serve_http.py tests/test_fixes_batch1.py tests/test_fixes_batch2.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose config
        run: docker compose -f deploy/docker-compose.reference.yml config
      - name: Build image
        run: docker build -f deploy/Dockerfile -t openagent:ci .
